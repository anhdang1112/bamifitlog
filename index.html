<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-title" content="Bami Fitness">
<meta name="description" content="Bami Fitness - personal workout planner and tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Bami Fitness</title>
</head>
<body>
<main id="view"></main>

<nav id="nav">
  <button data-view="home"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i>Schedule</button>
  <button data-view="plans"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="3.5"/><path d="M9.5 2.5h5v3h-5zM9 11h6M9 15h4"/></svg></i>Plans</button>
  <button data-view="dash"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></i>Dashboard</button>
  <button data-view="progress"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></i>Progress</button>
  <button data-view="settings"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></i>Settings</button>
</nav>

<div id="sheet" class="sheet" hidden><div id="sheetBody" class="sheet-body"></div></div>
<div id="picker" class="sheet picker" hidden><div id="pickerBody" class="sheet-body"></div></div>
<div id="rest" class="rest" hidden></div>
<button id="update" class="update" data-act="applyupdate" hidden></button>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="exercises.js"></script>
<script src="app.js"></script>
</body>
</html>
