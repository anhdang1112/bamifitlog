<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Personal workout planner and tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>FitLog</title>
</head>
<body>
<main id="view"></main>

<nav id="nav">
  <button data-view="home"><i>📅</i>Schedule</button>
  <button data-view="plans"><i>📋</i>Plans</button>
  <button data-view="dash"><i>📊</i>Dashboard</button>
  <button data-view="progress"><i>📈</i>Progress</button>
  <button data-view="settings"><i>⚙️</i>Settings</button>
</nav>

<div id="sheet" class="sheet" hidden><div id="sheetBody" class="sheet-body"></div></div>
<div id="rest" class="rest" hidden></div>
<div id="toast" class="toast" hidden></div>
<datalist id="exlist"></datalist>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="app.js"></script>
</body>
</html>
