<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-title" content="Bami Fitness">
<meta name="description" content="Bami Fitness - personal workout planner and tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Bami Fitness</title>
</head>
<body>
<main id="view"></main>

<nav id="nav">
  <button data-view="home"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="3" y="5" width="18" height="16" rx="3.5"/><path class="t" d="M8 2.8v3.4M16 2.8v3.4"/><path class="d" d="M3 10.5h18"/></svg></i>Schedule</button>
  <button data-view="plans"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="5" y="4" width="14" height="17" rx="3.5"/><path class="t" d="M9.5 2.5h5v3h-5z"/><path class="d" d="M9 11h6M9 15h4"/></svg></i>Routines</button>
  <button data-view="dash"><i><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="f" x="4" y="12" width="4" height="8" rx="1.4"/><rect class="f" x="10" y="4" width="4" height="16" rx="1.4"/><rect class="f" x="16" y="9" width="4" height="11" rx="1.4"/></svg></i>Dashboard</button>
  <button data-view="progress"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path class="t" d="M3 17l6-6 4 4 8-8"/><path class="t" d="M15 7h6v6"/></svg></i>Progress</button>
  <button data-view="settings"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path class="t" d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle class="f" cx="16" cy="7" r="2.6"/><circle class="f" cx="8" cy="17" r="2.6"/></svg></i>Settings</button>
</nav>

<div id="sheet" class="sheet" hidden><div id="sheetBody" class="sheet-body"></div></div>
<div id="picker" class="sheet picker" hidden><div id="pickerBody" class="sheet-body"></div></div>
<div id="rest" class="rest" hidden></div>
<button id="update" class="update" data-act="applyupdate" hidden></button>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="exercises.js"></script>
<script src="tags.js"></script>
<script src="coach.js"></script>
<script src="app.js"></script>
</body>
</html>
